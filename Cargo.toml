[workspace]
members = [
    "crates/a3s-test-agent",
    "crates/a3s-test-cli",
    "crates/a3s-test-core",
    "crates/a3s-test-driver-gui",
    "crates/a3s-test-driver-tui",
    "crates/a3s-test-driver-web",
    "crates/a3s-test-runner",
    "crates/a3s-test-session",
    "crates/a3s-test-worker",
]
resolver = "2"

[workspace.package]
version = "0.14.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/A3S-Lab/Test"
rust-version = "1.85"

[workspace.dependencies]
a3s-acl = "0.3.0"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
# Newer URL releases pull ICU versions above the workspace's Rust 1.85 MSRV.
url = "=2.4.1"
vt100 = "0.16.2"
