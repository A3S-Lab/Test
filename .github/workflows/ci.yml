name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        shell: bash
        run: >-
          bash .github/scripts/run-cargo-test.sh
          cargo test --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Assert Unix process-test cleanup
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          survivors="$(
            ps -axo pid=,command= | awk '
              /a3s-test-(browser|cua)-watchdog/ && $0 !~ /awk/ { print }
              /successful_command_descendant_fixture/ && $0 !~ /awk/ { print }
              /owned_process_tree_descendant_fixture/ && $0 !~ /awk/ { print }
              /fake-agent-browser/ && $0 !~ /awk/ { print }
            '
          )"
          runtime_roots=(/tmp)
          if [[ -n "${TMPDIR:-}" && "$TMPDIR" != /tmp ]]; then
            runtime_roots+=("$TMPDIR")
          fi
          runtimes="$(
            for runtime_root in "${runtime_roots[@]}"; do
              find "$runtime_root" -maxdepth 1 -type d \
                \( -name 'a3st-*' -o -name 'a3s-test-browser-*' \) -print
            done
          )"
          if [[ -n "$survivors" || -n "$runtimes" ]]; then
            printf 'Surviving process-test helpers:\n%s\n' "$survivors" >&2
            printf 'Surviving private runtimes:\n%s\n' "$runtimes" >&2
            exit 1
          fi

      - name: Assert Windows process-test cleanup
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $survivors = @(
            Get-CimInstance Win32_Process | Where-Object {
              $_.CommandLine -match 'successful_command_descendant_fixture' -or
              $_.CommandLine -match 'owned_process_tree_descendant_fixture'
            }
          )
          $runtimeRoot = [System.IO.Path]::GetTempPath()
          $runtimes = @(
            Get-ChildItem -LiteralPath $runtimeRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -like 'a3st-*' -or
                $_.Name -like 'a3s-test-browser-*'
              }
          )
          if ($survivors.Count -gt 0 -or $runtimes.Count -gt 0) {
            $survivors |
              Select-Object ProcessId, ParentProcessId, Name, CommandLine |
              Format-List | Out-String | Write-Error
            $runtimes | Select-Object FullName | Format-List | Out-String | Write-Error
            exit 1
          }

  web-e2e:
    name: Hermetic Web E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install the admitted standalone browser
        run: |
          npm install --global agent-browser@0.26.0
          agent-browser --version

      - name: Install pinned Chrome Headless Shell
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=147.0.7727.117
          case "$(uname -m)" in
            arm64) platform=mac-arm64 ;;
            x86_64) platform=mac-x64 ;;
            *) printf 'Unsupported macOS architecture: %s\n' "$(uname -m)" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/chrome-headless-shell.zip"
          root="$RUNNER_TEMP/chrome-headless-shell"
          curl --fail --location --retry 3 --output "$archive" \
            "https://storage.googleapis.com/chrome-for-testing-public/$version/$platform/chrome-headless-shell-$platform.zip"
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          executable="$root/chrome-headless-shell-$platform/chrome-headless-shell"
          chmod +x "$executable"
          printf 'AGENT_BROWSER_EXECUTABLE_PATH=%s\n' "$executable" >> "$GITHUB_ENV"
          "$executable" --version

      - name: Install pinned Chrome Headless Shell on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '147.0.7727.117'
          $platform = 'win64'
          $archive = Join-Path $env:RUNNER_TEMP 'chrome-headless-shell.zip'
          $root = Join-Path $env:RUNNER_TEMP 'chrome-headless-shell'
          $url = "https://storage.googleapis.com/chrome-for-testing-public/$version/$platform/chrome-headless-shell-$platform.zip"
          curl.exe --fail --location --retry 3 --output $archive $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $executable = Join-Path $root 'chrome-headless-shell-win64\chrome-headless-shell.exe'
          "AGENT_BROWSER_EXECUTABLE_PATH=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'AGENT_BROWSER_ARGS=--no-sandbox' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Chrome Headless Shell ${version}: $executable"
          & $executable --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the real browser suite
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export A3S_TEST_AGENT_BROWSER="$(command -v agent-browser)"
          bash .github/scripts/run-cargo-test.sh \
            cargo test -p a3s-test-cli --test web_e2e \
            real_agent_browser_runs_the_hermetic_web_suite \
            --locked -- --ignored --exact --nocapture

      - name: Run the real browser suite on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:A3S_TEST_AGENT_BROWSER = (Get-Command agent-browser.cmd).Source
          cargo test -p a3s-test-cli --test web_e2e `
            real_agent_browser_runs_the_hermetic_web_suite `
            --locked -- --ignored --exact --nocapture

      - name: Assert Unix browser cleanup
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          runtime_roots=(/tmp)
          if [[ -n "${TMPDIR:-}" && "$TMPDIR" != /tmp ]]; then
            runtime_roots+=("$TMPDIR")
          fi

          find_survivors() {
            ps -axo pid=,stat=,command= | awk '
              /agent-browser/ && $2 !~ /^Z/ && $0 !~ /awk/ { print }
              /Google Chrome/ && /agent-browser-chrome-/ && $2 !~ /^Z/ { print }
              /a3s-test-browser-watchdog/ && $2 !~ /^Z/ && $0 !~ /awk/ { print }
            '
          }
          find_runtimes() {
            for runtime_root in "${runtime_roots[@]}"; do
              find "$runtime_root" -maxdepth 1 -type d \
                \( -name 'a3st-*' -o -name 'a3s-test-browser-*' \) -print
            done
          }

          for _ in {1..40}; do
            survivors="$(find_survivors)"
            runtimes="$(find_runtimes)"
            if [[ -z "$survivors" && -z "$runtimes" ]]; then
              exit 0
            fi
            sleep 0.25
          done
          printf 'Surviving browser processes:\n%s\n' "$survivors" >&2
          printf 'Surviving private runtimes:\n%s\n' "$runtimes" >&2
          exit 1

      - name: Assert Windows browser cleanup
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtimeRoot = [System.IO.Path]::GetTempPath()
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            $survivors = @(
              Get-CimInstance Win32_Process | Where-Object {
                $_.Name -eq 'agent-browser-win32-x64.exe' -or
                ($_.Name -in @('chrome.exe', 'msedge.exe', 'chrome-headless-shell.exe') -and
                  $_.CommandLine -match 'agent-browser-chrome-')
              }
            )
            $runtimes = @(
              Get-ChildItem -LiteralPath $runtimeRoot -Directory -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -like 'a3st-*' -or
                  $_.Name -like 'a3s-test-browser-*'
                }
            )
            if ($survivors.Count -eq 0 -and $runtimes.Count -eq 0) {
              exit 0
            }
            Start-Sleep -Milliseconds 250
          }
          $survivors |
            Select-Object ProcessId, ParentProcessId, Name, CommandLine |
            Format-List | Out-String | Write-Error
          $runtimes | Select-Object FullName | Format-List | Out-String | Write-Error
          exit 1

  unix-installers:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test Unix installer
        run: bash tests/install-unix.sh

  windows-installer:
    name: Installer (windows)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test PowerShell installer
        shell: pwsh
        run: ./tests/install-windows.ps1
