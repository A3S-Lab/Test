name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: read

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create release from changelog
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md

  upload-cli:
    name: CLI (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}

      - name: Build and upload CLI
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: a3s-test
          package: a3s-test-cli
          target: ${{ matrix.target }}
          archive: a3s-test-$tag-$target
          locked: true
          checksum: sha256
          include: >-
            README.md
            LICENSE
            CHANGELOG.md
            assets/readme/hero.svg
            assets/readme/architecture.svg
          leading-dir: true
          tar: unix
          zip: windows

  upload-skill:
    name: Coding Agent Skill
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Package Skill
        working-directory: skills
        run: zip -X -r "${RUNNER_TEMP}/a3s-test.skill" a3s-test

      - name: Upload Skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/a3s-test.skill" --clobber
