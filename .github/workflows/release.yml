name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: read

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create release from changelog
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md

  upload-cli:
    name: CLI (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}

      - name: Build and upload CLI
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: a3s-test
          package: a3s-test-cli
          target: ${{ matrix.target }}
          archive: a3s-test-$tag-$target
          locked: true
          checksum: sha256
          include: >-
            README.md
            LICENSE
            CHANGELOG.md
            assets/readme/hero.svg
            assets/readme/architecture.svg
            scripts/install.sh
            scripts/install.ps1
          leading-dir: true
          tar: unix
          zip: windows

  publish-runner-image:
    name: Runner image (linux/amd64)
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build, verify, and publish the runner image
        env:
          A3S_TEST_RUNNER_CACHE_DIR: ${{ runner.temp }}/a3s-test-runner-cache
          A3S_TEST_RUNNER_SOURCE_REVISION: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/a3s-lab/a3s-test-runner
          version="${GITHUB_REF_NAME#v}"
          export A3S_TEST_RUNNER_IMAGE_VERSION="$version"

          sh images/runner/test-image.sh "$image:$version"
          docker tag "$image:$version" "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"

          digest="$(
            docker buildx imagetools inspect "$image:$version" \
              --format '{{.Manifest.Digest}}'
          )"
          latest_digest="$(
            docker buildx imagetools inspect "$image:latest" \
              --format '{{.Manifest.Digest}}'
          )"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$latest_digest" = "$digest"
          printf '%s@%s\n' "$image" "$digest" > "$RUNNER_TEMP/a3s-test-runner-image.txt"
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/a3s-test-runner-image.txt" \
            --clobber

  upload-skill:
    name: Coding Agent Skill
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Package Skill
        working-directory: skills
        run: |
          zip -X -r "${RUNNER_TEMP}/a3s-test.skill" a3s-test
          (
            cd "${RUNNER_TEMP}"
            sha256sum a3s-test.skill > a3s-test.skill.sha256
          )

      - name: Upload Skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          "${RUNNER_TEMP}/a3s-test.skill"
          "${RUNNER_TEMP}/a3s-test.skill.sha256"
          --clobber

  upload-testkit:
    name: Test Kit package
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/testkit/package-lock.json

      - name: Build and verify Test Kit
        working-directory: packages/testkit
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Package Test Kit
        working-directory: packages/testkit
        shell: bash
        run: |
          set -euo pipefail
          package="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          mv "$RUNNER_TEMP/$package" "$RUNNER_TEMP/a3s-testkit.tgz"
          (
            cd "$RUNNER_TEMP"
            sha256sum a3s-testkit.tgz > a3s-testkit.tgz.sha256
          )

      - name: Upload Test Kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          "${RUNNER_TEMP}/a3s-testkit.tgz"
          "${RUNNER_TEMP}/a3s-testkit.tgz.sha256"
          --clobber

  upload-installers:
    name: Installers
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          scripts/install.sh
          scripts/install.ps1
          --clobber
