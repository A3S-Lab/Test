version: 1
mode: bounded
expires_after: 1h
idle_timeout: 10m
resources: {}
allow:
  tools:
    - get_config
    - check_permissions
    - start_session
    - get_session_state
    - end_session
    - list_apps
    - launch_app
    - list_windows
    - get_window_state
    - kill_app
deny:
  tools: []
ask:
  tools: []
