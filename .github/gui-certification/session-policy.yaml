version: 2
mode: bounded
expires_after: 1h
idle_timeout: 10m
resources:
  desktop:
    display: true
  apps:
    - bundle_id: com.trycua.harness.appkit
      launch: true
      windows: all
      terminate: driver_launched
allow:
  tools:
    - get_config
    - check_permissions
    - start_session
    - get_session_state
    - end_session
    - list_apps
    - launch_app
    - list_windows
    - get_window_state
    - kill_app
deny:
  tools: []
ask:
  tools: []
