<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pixels</title>
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
        overflow: hidden;
      }
      #swatch {
        width: 120px;
        height: 60px;
        background: rgb(0, 128, 255);
        animation: pulse 80ms infinite;
      }
      @keyframes pulse {
        from {
          background: rgb(0, 128, 255);
        }
        to {
          background: rgb(0, 200, 255);
        }
      }
      #caret {
        position: absolute;
        left: 8px;
        top: 80px;
      }
    </style>
  </head>
  <body>
    <div id="swatch"></div>
    <input id="caret" autofocus />
    <button id="shift" type="button">Shift</button>
    <script>
      document.getElementById("shift").addEventListener("click", () => {
        const swatch = document.getElementById("swatch");
        swatch.style.animation = "none";
        swatch.style.background = "rgb(200, 0, 0)";
      });
    </script>
  </body>
</html>
