<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A3S Test transient assertion fixture</title>
    <style>
      body {
        font: 16px/1.5 system-ui, sans-serif;
        margin: 24px;
      }

      output {
        display: block;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A3S Test transient assertion fixture</h1>
      <output data-testid="transient-state">Transient state is visible</output>
      <output data-testid="hidden-static" hidden>Static hidden state</output>
      <output data-testid="visible-static">Static visible state</output>
      <output
        data-testid="hidden-then-visible"
        style="box-sizing: border-box; width: 0; height: 20px; padding: 0; overflow: hidden"
      >
        Hidden state that reappears
      </output>
    </main>

    <script>
      const transient = document.querySelector('[data-testid="transient-state"]');
      const readRect = transient.getBoundingClientRect.bind(transient);
      let firstVisibilitySample = true;

      transient.getBoundingClientRect = () => {
        const rect = readRect();
        if (firstVisibilitySample) {
          firstVisibilitySample = false;
          queueMicrotask(() => {
            transient.hidden = true;
          });
        }
        return rect;
      };

      const hiddenThenVisible = document.querySelector('[data-testid="hidden-then-visible"]');
      const readHiddenRect = hiddenThenVisible.getBoundingClientRect.bind(hiddenThenVisible);
      let firstHiddenSample = true;

      hiddenThenVisible.getBoundingClientRect = () => {
        const rect = readHiddenRect();
        if (firstHiddenSample) {
          firstHiddenSample = false;
          queueMicrotask(() => {
            hiddenThenVisible.style.width = "240px";
          });
        }
        return rect;
      };
    </script>
  </body>
</html>
