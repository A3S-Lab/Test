<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A3S Test interactability assertion fixture</title>
    <style>
      * { box-sizing: border-box; }
      body { font: 16px/1.5 system-ui, sans-serif; margin: 0; min-height: 2400px; }
      h1 { margin: 520px 24px 0; }
      .target {
        align-items: center;
        background: #dbeafe;
        border: 1px solid #2563eb;
        display: flex;
        height: 60px;
        justify-content: center;
        position: fixed;
        width: 120px;
        z-index: 10;
      }
      .overlay {
        background: #ef4444;
        height: 60px;
        position: fixed;
        width: 120px;
        z-index: 20;
      }
      .visually-hidden {
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        height: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }
      interactability-shadow-fixture {
        display: block;
        height: 60px;
        left: 920px;
        position: fixed;
        top: 20px;
        width: 120px;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <h1>A3S Test interactability assertion fixture</h1>

    <button class="target" data-testid="plain-target" style="left:20px;top:20px" type="button">
      Plain target
    </button>
    <button class="target" aria-label="Role pointer target" style="left:170px;top:20px" type="button"></button>
    <label class="visually-hidden" for="label-target">Label pointer target</label>
    <input class="target" id="label-target" style="left:320px;top:20px" />
    <input class="target" placeholder="Placeholder pointer target" style="left:470px;top:20px" />
    <span class="target" style="left:620px;top:20px">Exact pointer copy</span>
    <span class="target" id="css-aria-hidden" aria-hidden="true" style="left:770px;top:20px">CSS target</span>
    <interactability-shadow-fixture></interactability-shadow-fixture>
    <button class="target" data-testid="child-hit-target" style="left:1070px;top:20px" type="button">
      <span style="display:flex;align-items:center;justify-content:center;width:100%;height:100%">Child hit</span>
    </button>

    <button class="target" data-testid="covered-target" style="left:20px;top:120px" type="button">Covered</button>
    <div class="overlay" data-testid="covering-overlay" style="left:20px;top:120px"></div>

    <button class="target" data-testid="partial-cover-target" style="left:170px;top:120px" type="button">Partial</button>
    <div class="overlay" style="left:170px;top:120px;width:80px"></div>

    <button class="target" data-testid="transparent-cover-target" style="left:320px;top:120px" type="button">Transparent</button>
    <div class="overlay" style="left:320px;top:120px;opacity:0"></div>

    <button class="target" data-testid="pass-through-target" style="left:470px;top:120px" type="button">Pass through</button>
    <div class="overlay" style="left:470px;top:120px;pointer-events:none"></div>

    <button
      class="target"
      data-testid="pointer-none-target"
      style="left:620px;top:120px;pointer-events:none"
      type="button"
    >Pointer none</button>
    <button class="target" data-testid="stable-viewport-target" style="left:770px;top:120px" type="button">Stable viewport</button>
    <button class="target" data-testid="stable-pointer-target" style="left:920px;top:120px" type="button">Stable pointer</button>

    <button class="target" data-testid="partial-viewport-target" style="left:-30px;top:220px;width:60px" type="button">Partial viewport</button>
    <button class="target" data-testid="offscreen-target" style="left:calc(100vw + 20px);top:220px" type="button">Offscreen</button>
    <button
      class="target"
      data-testid="hidden-semantic-target"
      aria-label="Hidden semantic pointer target"
      aria-hidden="true"
      style="left:170px;top:220px"
      type="button"
    ></button>
    <button class="target ambiguous-target" style="left:320px;top:220px" type="button">Ambiguous A</button>
    <button class="target ambiguous-target" style="left:470px;top:220px" type="button">Ambiguous B</button>
    <button class="target" data-testid="invalid-geometry-target" style="left:620px;top:220px" type="button">Invalid geometry</button>

    <button class="target" data-testid="transient-viewport-target" style="left:770px;top:220px" type="button">Transient viewport</button>
    <button class="target" data-testid="transient-pointer-target" style="left:920px;top:220px" type="button">Transient pointer</button>
    <div class="overlay" id="transient-pointer-overlay" style="display:none;left:920px;top:220px"></div>

    <script>
      class InteractabilityShadowFixture extends HTMLElement {
        constructor() {
          super();
          const root = this.attachShadow({ mode: "open" });
          root.innerHTML = `
            <style>
              button { align-items:center; background:#ede9fe; border:1px solid #7c3aed; display:flex; height:60px; justify-content:center; width:120px; }
              span { align-items:center; display:flex; height:100%; justify-content:center; width:100%; }
            </style>
            <button id="shadow-pointer-target" type="button" aria-label="Shadow pointer target"><span>Shadow child</span></button>
          `;
        }
      }
      customElements.define("interactability-shadow-fixture", InteractabilityShadowFixture);

      const invalidGeometry = document.querySelector('[data-testid="invalid-geometry-target"]');
      const validGeometryRect = invalidGeometry.getBoundingClientRect.bind(invalidGeometry);
      let invalidGeometryReads = 0;
      invalidGeometry.getBoundingClientRect = () => {
        invalidGeometryReads += 1;
        const rect = validGeometryRect();
        return invalidGeometryReads === 1
          ? rect
          : new DOMRect(rect.x, rect.y, 0, rect.height);
      };

      const transientViewport = document.querySelector('[data-testid="transient-viewport-target"]');
      const transientViewportRect = transientViewport.getBoundingClientRect.bind(transientViewport);
      let transientViewportSampled = false;
      transientViewport.getBoundingClientRect = () => {
        const rect = transientViewportRect();
        if (!transientViewportSampled) {
          transientViewportSampled = true;
          queueMicrotask(() => { transientViewport.style.left = "calc(100vw + 40px)"; });
        }
        return rect;
      };

      const transientPointer = document.querySelector('[data-testid="transient-pointer-target"]');
      const transientPointerRect = transientPointer.getBoundingClientRect.bind(transientPointer);
      let transientPointerSampled = false;
      transientPointer.getBoundingClientRect = () => {
        const rect = transientPointerRect();
        if (!transientPointerSampled) {
          transientPointerSampled = true;
          queueMicrotask(() => {
            document.querySelector("#transient-pointer-overlay").style.display = "block";
          });
        }
        return rect;
      };
    </script>
  </body>
</html>
