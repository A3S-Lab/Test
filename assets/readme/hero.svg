    <circle cx="22" cy="23" r="4" fill="#bfd0e8"/>
    <circle cx="38" cy="23" r="4" fill="#bfd0e8"/>
    <circle cx="54" cy="23" r="4" fill="#bfd0e8"/>
    <text x="74" y="29" fill="#56657b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">localhost:3000 / checkout</text>

    <g transform="translate(20 66)" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
      <text x="0" y="25" fill="#101827" font-size="24" font-weight="750">Review order</text>
      <rect y="48" width="264" height="76" rx="10" fill="#f8fbff" stroke="#dce4f0"/>
      <text x="16" y="78" fill="#56657b" font-size="18">Order total</text>
      <text x="174" y="80" fill="#101827" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700">$1,248</text>
      <rect y="145" width="264" height="58" rx="10" fill="#eaf2ff" stroke="#1264ff" stroke-width="2"/>
