<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="500" viewBox="0 0 1200 500"
     role="img" aria-labelledby="title desc">
  <title id="title">A3S Test — AI-native test engine</title>
  <desc id="desc">A persistent test ledger shows a goal becoming observation 1, a provenance-bound click on ref e1, and a passing evidence report. Agent sessions and ACL suites share the same typed core.</desc>

  <rect width="1200" height="500" rx="24" fill="#080A0D"/>
  <path d="M0 72H1200" stroke="#242A33"/>

  <g id="repository-metadata"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle cx="57" cy="36" r="5" fill="#6EE7B7"/>
    <text x="72" y="43" fill="#B7C0CC" font-size="18" font-weight="700" letter-spacing="1.8">A3S / TEST ENGINE</text>

    <g transform="translate(692 20)" font-size="18" font-weight="700">
      <rect width="174" height="34" rx="17" fill="#10241D" stroke="#2E755B"/>
      <text x="87" y="23" text-anchor="middle" fill="#8DF0C5">AGENT SESSION</text>

      <rect x="186" width="132" height="34" rx="17" fill="#2A2112" stroke="#81632D"/>
      <text x="252" y="23" text-anchor="middle" fill="#F7C873">ACL SUITE</text>

      <rect x="330" width="122" height="34" rx="17" fill="#131820" stroke="#343D49"/>
      <text x="391" y="23" text-anchor="middle" fill="#B7C0CC">RUST CLI</text>
    </g>
  </g>

  <g id="title-block" transform="translate(56 108)">
    <text x="0" y="82"
          fill="#F6F8F7" font-size="88" font-weight="780" letter-spacing="-3"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">A3S TEST</text>
    <text x="3" y="132"
          fill="#6EE7B7" font-size="22" font-weight="750" letter-spacing="3.8"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">AI-NATIVE · CROSS-SURFACE · EVIDENCE-FIRST</text>
    <text x="3" y="184"
          fill="#DCE2E7" font-size="29" font-weight="520"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Agents explore. Typed ACL replays. Every turn leaves proof.</text>
  </g>

  <g id="execution-ledger" transform="translate(56 318)">
    <g id="start-step">
      <rect width="260" height="142" rx="14" fill="#0F1318" stroke="#303844"/>
      <text x="20" y="34" fill="#8E99A8" font-size="18" font-weight="700" letter-spacing="1.4"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">01 / START</text>
      <text x="20" y="76" fill="#F6F8F7" font-size="23" font-weight="700"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">goal + success</text>
      <text x="20" y="111" fill="#AAB4C0" font-size="19"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">session: checkout</text>
    </g>

    <g id="observe-step" transform="translate(276 0)">
      <rect width="260" height="142" rx="14" fill="#0D1714" stroke="#3A8B6C"/>
      <text x="20" y="34" fill="#6EE7B7" font-size="18" font-weight="700" letter-spacing="1.4"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">02 / OBSERVE</text>
      <text x="20" y="76" fill="#F6F8F7" font-size="22" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">observation_id: 1</text>
      <text x="20" y="111" fill="#9EDDBF" font-size="18"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@e1 [button] Continue</text>
    </g>

    <g id="act-step" transform="translate(552 0)">
      <rect width="260" height="142" rx="14" fill="#18140C" stroke="#80632F"/>
      <text x="20" y="34" fill="#F7C873" font-size="18" font-weight="700" letter-spacing="1.4"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">03 / ACT</text>
      <text x="20" y="76" fill="#F6F8F7" font-size="23" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">click @e1</text>
      <text x="20" y="111" fill="#D8BF8B" font-size="18"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">schema + policy checked</text>
    </g>

    <g id="prove-step" transform="translate(828 0)">
      <rect width="260" height="142" rx="14" fill="#0F1318" stroke="#3A8B6C"/>
      <text x="20" y="34" fill="#6EE7B7" font-size="18" font-weight="700" letter-spacing="1.4"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">04 / PROVE</text>
      <rect x="20" y="54" width="86" height="36" rx="18" fill="#6EE7B7"/>
      <text x="63" y="79" text-anchor="middle" fill="#07110D" font-size="18" font-weight="850"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PASS</text>
      <text x="20" y="121" fill="#AAB4C0" font-size="18"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">events.jsonl + report.json</text>
    </g>
  </g>
</svg>
