<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">A3S Test, the evidence loop for interface coding agents</title>
  <desc id="desc">A selected checkout button is bound to the current page revision, its source file, and fresh verification evidence.</desc>

  <rect width="1200" height="400" rx="24" fill="#f8fbff"/>
  <rect x="1" y="1" width="1198" height="398" rx="23" fill="none" stroke="#dce4f0" stroke-width="2"/>

  <g transform="translate(56 42)">
    <rect width="48" height="48" rx="13" fill="#1264ff"/>
    <path d="M13 21v-7h7M28 14h7v7M35 28v7h-7M20 35h-7v-7" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="24" cy="25" r="3.5" fill="#fff"/>
    <text x="66" y="32" fill="#56657b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" letter-spacing="1.6">INTERFACE TESTING FOR CODING AGENTS</text>
  </g>

  <g font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">
    <text x="56" y="172" fill="#101827" font-size="72" font-weight="780" letter-spacing="-3.2">A3S TEST</text>
    <text x="58" y="224" fill="#101827" font-size="28" font-weight="650">See the current interface.</text>
    <text x="58" y="262" fill="#56657b" font-size="28" font-weight="540">Find the source. Keep the proof.</text>
  </g>

  <g transform="translate(58 318)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700">
    <text x="0" y="18" fill="#1264ff">OBSERVE</text>
    <path d="M98 12h42m-8-7 8 7-8 7" fill="none" stroke="#bfd0e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="158" y="18" fill="#7157c9">REVIEW</text>
    <path d="M244 12h42m-8-7 8 7-8 7" fill="none" stroke="#bfd0e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="304" y="18" fill="#0c9b70">VERIFY</text>
  </g>

  <g transform="translate(650 36)">
    <rect width="494" height="328" rx="18" fill="#fff" stroke="#dce4f0" stroke-width="2"/>
