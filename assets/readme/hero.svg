      <rect x="-7" y="138" width="278" height="72" rx="12" fill="none" stroke="#7157c9" stroke-width="2"/>
      <g fill="#7157c9">
        <rect x="-11" y="134" width="8" height="8" rx="2"/>
        <rect x="267" y="134" width="8" height="8" rx="2"/>
        <rect x="-11" y="206" width="8" height="8" rx="2"/>
        <rect x="267" y="206" width="8" height="8" rx="2"/>
      </g>
    </g>

    <g transform="translate(310 66)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
      <text x="0" y="20" fill="#1264ff" font-size="18" font-weight="750">PAGE CONTEXT</text>
      <path d="M0 36h164" stroke="#dce4f0"/>
      <text x="0" y="67" fill="#5f6d84" font-size="16">TARGET</text>
      <rect y="78" width="164" height="38" rx="7" fill="#eaf2ff"/>
      <text x="12" y="103" fill="#0a46ad" font-size="17" font-weight="700">@c42 · button</text>
      <text x="0" y="147" fill="#5f6d84" font-size="16">REVISION</text>
      <text x="112" y="147" fill="#101827" font-size="18" font-weight="750">12</text>
      <path d="M0 165h164" stroke="#dce4f0"/>
      <text x="0" y="194" fill="#5f6d84" font-size="16">SOURCE</text>
      <text x="0" y="222" fill="#101827" font-size="17" font-weight="700">Checkout.tsx:88</text>
      <rect y="242" width="164" height="44" rx="9" fill="#e5f8f1" stroke="#b9e5d4"/>
      <circle cx="21" cy="264" r="8" fill="#0c9b70"/>
      <path d="m17 264 3 3 5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="37" y="270" fill="#087855" font-size="17" font-weight="750">fresh proof</text>
    </g>

    <path d="M291 241h22m-7-6 7 6-7 6" fill="none" stroke="#7157c9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
