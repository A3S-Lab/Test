<!doctype html>
<html lang="en" data-hydrated="false">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A3S TestKit browser fixture</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        margin: 24px;
        min-height: 1400px;
      }
      button,
      select,
      a {
        font: inherit;
      }
      #audit-controls {
        border: 1px solid #777;
        margin: 20px 0;
        max-width: 720px;
        padding: 16px;
      }
      #audit-controls h2 {
        margin-top: 0;
      }
      #audit-controls .audit-actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      #audit-controls label {
        font-weight: 650;
      }
      #audit-status:empty {
        display: none;
      }
      #motion-probe {
        position: absolute;
        overflow: hidden;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      #motion-probe > span {
        display: block;
        animation: fixture-motion 60s linear infinite;
      }
      #motion-probe > #paused-motion {
        animation-play-state: paused;
      }
      @keyframes fixture-motion {
        to {
          transform: translateX(1px);
        }
      }
      #nested {
        width: 420px;
        height: 140px;
        overflow: auto;
        border: 1px solid #999;
      }
      .virtual-space {
        height: 400px;
      }
      #sticky {
        position: sticky;
        top: 0;
        transform: scale(1);
      }
      #zoom-edge {
        position: absolute;
        left: 1000px;
        top: 140px;
        width: 180px;
        height: 40px;
      }
      #layout-section {
        width: 560px;
        height: 180px;
      }
      #portal {
        position: fixed;
        right: 24px;
        top: 24px;
      }
    </style>
  </head>
  <body>
    <!-- prettier-ignore -->
    <div id="root"><main><h1>Embedded TestKit E2E</h1><div id="motion-probe" aria-hidden="true"><span id="running-motion"></span><span id="paused-motion"></span></div><section id="audit-controls" aria-labelledby="audit-controls-title"><h2 id="audit-controls-title">Screen-reader audit controls</h2><p>These controls expose test-only candidate and repair states without DevTools.</p><div class="audit-actions"><button type="button">Seed contract and design candidates</button><label for="audit-repair-state">Repair state</label><select id="audit-repair-state"><option value="needs_input">Clarification needed</option><option value="review_ready">Human review ready</option><option value="resolved">Resolved</option><option value="dismissed">Dismissed</option><option value="cancelled">Cancelled</option><option value="failed">Failed</option></select><button type="button">Apply repair state</button><button type="button">Reset fixture</button><a href="/screen-reader-workflows.json">Audit workflow manifest</a></div><p id="audit-status" role="status" aria-live="polite" aria-atomic="true"></p></section><button id="sticky" data-testid="repair-target">__ACTION_LABEL__</button><button id="host-probe">Host interaction probe</button><button id="zoom-edge" data-testid="zoom-edge">Zoom edge target</button><section id="layout-section" data-testid="layout-section" tabindex="-1">Layout source section</section><div id="nested"><div class="virtual-space"><button id="virtual-row">Virtual row 1</button></div></div><div id="shadow-host"></div></main></div>
    <div id="portal"></div>
    <script>
      window.testkitInitialRepaired = __INITIAL_REPAIRED__;
    </script>
    <script type="module" src="/testkit.js"></script>
  </body>
</html>
